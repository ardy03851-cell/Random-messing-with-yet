<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#03040a" />
  <title>Calyx</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23445bff'/%3E%3Cpath d='m32 10 4.5 15.5 15.5 4.5-15.5 4.5L32 50l-4.5-15.5L12 30l15.5-4.5Z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="icon" type="image/png" href="web.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="web.png?v=2" />
  <link rel="apple-touch-icon" href="web.png?v=2" />




  <style>
    :root {
      --bg: #020309;
      --panel: rgba(13, 16, 29, .78);
      --panel2: rgba(19, 22, 39, .72);
      --line: rgba(255, 255, 255, .10);
      --line2: rgba(118, 139, 255, .22);
      --text: #f5f7ff;
      --muted: #858ba5;
      --blue: #6f82ff;
      --blue2: #9b7cff;
      --glow: rgba(65, 91, 255, .45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif
    }

    button,
    textarea {
      font: inherit
    }

    button {
      border: 0;
      color: inherit
    }

    body:before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 50% 36%, rgba(47, 68, 255, .16), transparent 30%),
        radial-gradient(circle at 15% 100%, rgba(81, 55, 255, .10), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(23, 106, 255, .08), transparent 25%);
      pointer-events: none;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, .055);
      background: rgba(2, 3, 9, .62);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -.02em
    }

    .brandmark {
      width: 31px;
      height: 31px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #8d9cff, #445bff);
      box-shadow: 0 0 25px rgba(77, 93, 255, .4)
    }

    .brandmark svg {
      width: 18px;
      height: 18px
    }

    .top-actions {
      display: flex;
      gap: 8px
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .07);
      display: grid;
      place-items: center;
      cursor: pointer
    }

    .icon-btn:active {
      transform: scale(.96);
      background: rgba(255, 255, 255, .10)
    }

    svg {
      display: block
    }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative
    }

    .chat {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      transition: width .35s ease
    }

    .messages {
      width: min(850px, 100%);
      flex: 1;
      overflow: auto;
      padding: 38px 20px 160px;
      scrollbar-width: none
    }

    .messages::-webkit-scrollbar {
      display: none
    }

    .welcome {
      height: 100%;
      min-height: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px
    }

    .orb {
      width: 76px;
      height: 76px;
      border-radius: 25px;
      margin-bottom: 22px;
      position: relative;
      background: rgba(28, 34, 70, .55);
      border: 1px solid rgba(139, 151, 255, .24);
      box-shadow: 0 0 70px rgba(64, 87, 255, .23), inset 0 0 35px rgba(101, 115, 255, .12);
      display: grid;
      place-items: center
    }

    .orb:before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: conic-gradient(from 0deg, transparent, #6c7cff, transparent, #9e73ff, transparent);
      filter: blur(1px);
      opacity: .7;
      animation: spin 5s linear infinite
    }

    .orb:after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 23px;
      background: #0b0d19
    }

    .orb svg {
      position: relative;
      z-index: 2
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .welcome h1 {
      font-size: 32px;
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: -.04em
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      max-width: 520px
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 0 0 28px
    }

    .message.user {
      justify-content: flex-end
    }

    .bubble {
      max-width: 78%;
      padding: 14px 16px;
      border-radius: 19px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .07);
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap
    }

    .user .bubble {
      background: rgba(69, 81, 155, .30);
      border-color: rgba(116, 132, 255, .20)
    }

    .ai .bubble {
      background: transparent;
      border: 0;
      padding: 2px 0;
      max-width: 90%
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #11162a;
      border: 1px solid var(--line);
      flex: none;
      overflow: hidden
    }

    .avatar img,
    .avatar svg {
      width: 20px;
      height: 20px
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 8px 0
    }

    .typing i {
      width: 5px;
      height: 5px;
      background: #9da8ff;
      border-radius: 50%;
      animation: b 1s infinite
    }

    .typing i:nth-child(2) {
      animation-delay: .15s
    }

    .typing i:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes b {
      50% {
        opacity: .25;
        transform: translateY(-3px)
      }
    }

    .spinner-3d-wrap {
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .spinner-3d-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .code-card {
      margin-top: 14px;
      border: 1px solid rgba(110, 129, 255, .20);
      border-radius: 18px;
      overflow: hidden;
      background: #080a11;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .35)
    }

    .code-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #0d1019;
      border-bottom: 1px solid var(--line)
    }

    .dots {
      display: flex;
      gap: 5px
    }

    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34394b
    }

    .lang {
      font-size: 11px;
      color: #7e85a0;
      text-transform: uppercase;
      letter-spacing: .12em
    }

    .copy {
      font-size: 12px;
      color: #aeb5d4;
      background: transparent;
      padding: 6px 8px;
      cursor: pointer
    }

    pre {
      margin: 0;
      padding: 17px;
      overflow: auto;
      font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #dce1ff;
      tab-size: 2
    }

    .composer-wrap {
      width: min(850px, 100%);
      padding: 0 20px calc(18px + env(safe-area-inset-bottom));
      position: absolute;
      bottom: 0;
      z-index: 8
    }

    .composer {
      position: relative;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(110deg, #4c5cff, #a875ff, #426cff, #6d78ff);
      background-size: 300% 300%;
      animation: borderFlow 7s ease infinite;
      box-shadow: 0 0 55px rgba(57, 72, 255, .17)
    }

    .composer:before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: inherit;
      filter: blur(13px);
      opacity: .38;
      z-index: -1;
      animation: borderFlow 7s ease infinite
    }

    @keyframes borderFlow {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .composer-inner {
      background: rgba(9, 11, 20, .91);
      border-radius: 23px;
      min-height: 122px;
      padding: 15px 16px 12px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px)
    }

    textarea {
      width: 100%;
      height: 58px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 1.45
    }

    textarea::placeholder {
      color: #686e87
    }

    .composer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .model-select {
      min-height: 38px;
      max-width: 240px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .06);
      cursor: pointer;
      color: #dfe3f7;
      font-size: 13px
    }

    .model-select img,
    .model-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border-radius: 6px
    }

    .model-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .send {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: linear-gradient(145deg, #8b9aff, #5266ff);
      box-shadow: 0 8px 25px rgba(72, 88, 255, .35)
    }

    .send:active {
      transform: scale(.95)
    }

    .send[disabled] {
      opacity: .4;
      filter: grayscale(1)
    }

    .model-menu {
      position: absolute;
      left: 16px;
      bottom: 78px;
      width: min(340px, calc(100% - 32px));
      padding: 8px;
      border-radius: 18px;
      background: rgba(12, 15, 26, .96);
      border: 1px solid rgba(133, 147, 255, .18);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      backdrop-filter: blur(25px);
      display: none;
      z-index: 30
    }

    .model-menu.open {
      display: block
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border-radius: 12px;
      cursor: pointer
    }

    .model-item:hover,
    .model-item:active {
      background: rgba(255, 255, 255, .06)
    }

    .model-item strong {
      font-size: 13px
    }

    .model-item small {
      display: block;
      color: #727991;
      margin-top: 2px
    }

    .model-item .badge {
      margin-left: auto;
      font-size: 10px;
      color: #9fa8d2;
      border: 1px solid var(--line);
      padding: 4px 6px;
      border-radius: 7px
    }

    .workspace {
      width: 0;
      overflow: hidden;
      border-left: 1px solid transparent;
      background: #05070d;
      transition: width .35s ease;
      display: flex;
      flex-direction: column
    }

    .workspace.active {
      width: 50%;
      border-left-color: var(--line)
    }

    .workspace-head {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid var(--line)
    }

    .workspace-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600
    }

    .file-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7184ff;
      box-shadow: 0 0 12px #7184ff
    }

    .workspace-body {
      flex: 1;
      min-height: 0;
      display: flex
    }

    .line-nos {
      width: 45px;
      padding: 16px 8px;
      text-align: right;
      color: #34394a;
      font: 12px/1.65 ui-monospace, monospace;
      border-right: 1px solid rgba(255, 255, 255, .04)
    }

    .editor {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 16px;
      font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #dce1ff;
      white-space: pre
    }

    .workspace-foot {
      height: 48px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      color: #6f7690;
      font-size: 11px
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .status i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6f82ff
    }

    @media(max-width:820px) {
      .workspace.active {
        position: absolute;
        inset: 0;
        width: 100%;
        z-index: 20
      }

      .workspace:not(.active) {
        display: none
      }

      .messages {
        padding-top: 20px
      }

      .welcome h1 {
        font-size: 27px
      }

      .bubble {
        max-width: 88%
      }

      .composer-wrap {
        padding-left: 12px;
        padding-right: 12px
      }

      .model-select {
        max-width: 180px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brandmark" aria-hidden="true">
          <img src="web.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: inherit;" />
        </div>
        <span>Forge</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="newChat" title="New chat" aria-label="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
        <button class="icon-btn" id="closeWorkspace" title="Close code" aria-label="Close code" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      </div>
    </header>

    <main class="main">
      <section class="chat">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <div class="orb" id="welcomeOrb">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                <path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z" stroke="#dbe0ff"
                  stroke-width="1.4" />
                <path d="m19 4 .55 1.45L21 6l-1.45.55L19 8l-.55-1.45L17 6l1.45-.55L19 4Z" stroke="#8190ff"
                  stroke-width="1.1" />
              </svg>
            </div>
            <h1>What are we building?</h1>
            <p>Describe the website, game, app, or feature you want to create. Forge will work with the selected AI
              model and surface code when it starts coding.</p>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="model-menu" id="modelMenu"></div>
          <div class="composer">
            <div class="composer-inner">
              <textarea id="prompt" placeholder="Ask Forge to build something…" autocomplete="off" spellcheck="false"></textarea>
              <div class="composer-row">
                <div class="left-tools">
                  <button class="model-select" id="modelSelect" type="button" aria-label="Choose AI model">
                  <span id="selectedLogo"></span>
                  <span class="model-name" id="selectedModel">Loading models…</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                </div>
                <div class="right-tools">
                  <button class="icon-btn" id="clearPrompt" title="Clear" aria-label="Clear prompt">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                  <button class="send" id="send" title="Send" aria-label="Send">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 5.5 20 12 4 18.5l2.4-5.8L14 12l-7.6-.7L4 5.5Z" fill="white"/></svg>
                </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="workspace" id="workspace">
        <div class="workspace-head">
          <div class="workspace-title"><span class="file-dot"></span><span id="fileName">index.html</span></div>
          <button class="icon-btn" id="copyCode" title="Copy code" aria-label="Copy code">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        </div>
        <div class="workspace-body">
          <div class="line-nos" id="lineNos">1</div>
          <div class="editor" id="editor">// Your generated code will appear here.</div>
        </div>
        <div class="workspace-foot"><span class="status"><i></i> AI workspace</span><span>Ready</span></div>
      </aside>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    /*
    Forge is intentionally connected to models.js rather than duplicating a model list here.

    Keep models.js beside this file:
      /index.html
      /models.js

    Adding a model to models.js automatically adds it to the model picker.
  */
  import * as THREE from 'three';
  import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { models } from "./models.js";

  // =============================================================
  // MODEL ID TO 3D MODEL (.obj) MAPPING
  // Type your exact model IDs (from models.js) and their .obj files here.
  // Place all .obj files inside the "models" folder.
  // =============================================================
  const MODEL_3D_MAP = {
    "gpt-4o": "models/gpt-4o.obj",
    "moonshotai/kimi-k3": "models/kimi.obj",
    "claude-sonnet-5": "models/claude.obj",
    "gemini-1.5-pro": "models/gemini-1.5-pro.obj",
    "deepseek-v4-flash": "models/deepseek.obj",
    "gpt-5-image": "models/gpt5.obj",
    "default": "models/default.obj"
  };

  const $ = id => document.getElementById(id);

  let welcomeOrbCleanup = null;

  function load3DModelSpinner(container, modelId) {
    if (!container) return () => {};
    const modelPath = MODEL_3D_MAP[modelId] || MODEL_3D_MAP["default"] || `models/${modelId || "default"}.obj`;
    const ext = modelPath.split('.').pop().toLowerCase();

    const width = container.clientWidth || 76;
    const height = container.clientHeight || 76;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.style.position = "relative";
    renderer.domElement.style.zIndex = "2";

    container.innerHTML = "";
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x8d9cff, 2.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    let loadedMesh = null;

    const handleSuccess = (object) => {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 1.8 / maxDim;

      object.position.sub(center.multiplyScalar(scale));
      object.scale.set(scale, scale, scale);

      object.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0x8d9cff,
            metalness: 0.3,
            roughness: 0.2
          });
        }
      });

      loadedMesh = object;
      scene.add(object);
    };

    const handleError = (err) => {
      console.error(`Failed to load 3D model from "${modelPath}":`, err);
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({ color: 0x6f82ff });
      loadedMesh = new THREE.Mesh(geometry, material);
      scene.add(loadedMesh);
    };

    if (ext === 'gltf' || ext === 'glb') {
      const loader = new GLTFLoader();
      loader.load(modelPath, (gltf) => handleSuccess(gltf.scene), undefined, handleError);
    } else {
      const loader = new OBJLoader();
      loader.load(modelPath, handleSuccess, undefined, handleError);
    }

    let animId;
    function animate() {
      animId = requestAnimationFrame(animate);
      if (loadedMesh) {
        loadedMesh.rotation.y += 0.025;
        loadedMesh.rotation.x += 0.01;
      }
      renderer.render(scene, camera);
    }
    animate();

    return () => {
      cancelAnimationFrame(animId);
      renderer.dispose();
      container.innerHTML = "";
    };
  }
  const messages = $("messages");
  const welcome = $("welcome");
  const prompt = $("prompt");
  const send = $("send");
  const modelSelect = $("modelSelect");
  const modelMenu = $("modelMenu");
  const selectedModel = $("selectedModel");
  const selectedLogo = $("selectedLogo");
  const workspace = $("workspace");
  const closeWorkspace = $("closeWorkspace");
  const editor = $("editor");
  const lineNos = $("lineNos");
  const fileName = $("fileName");

  let activeModel = models?.[0] || null;
  let latestCode = "";

  function logoElement(model, size = 20){
    const holder = document.createElement("span");
    holder.className = "model-logo";
    holder.style.width = size + "px";
    holder.style.height = size + "px";

    if (model?.logoUrl) {
      const img = document.createElement("img");
      img.src = model.logoUrl;
      img.alt = model.name || "Model logo";
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "contain";
      img.onerror = () => {
        if (model.fallbackUrl && img.src !== model.fallbackUrl) {
          img.src = model.fallbackUrl;
        } else {
          holder.innerHTML = model?.logoSvg || `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/></svg>`;
          const svg = holder.querySelector("svg");
          if(svg){ svg.setAttribute("width", size); svg.setAttribute("height", size); }
        }
      };
      holder.appendChild(img);
    } else {
      holder.innerHTML = model?.logoSvg || `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/></svg>`;
      const svg = holder.querySelector("svg");
      if(svg){ svg.setAttribute("width", size); svg.setAttribute("height", size); }
    }

    return holder;
  }

  function renderModels(){
    modelMenu.innerHTML = "";
    if(!models.length){
      selectedModel.textContent = "No models";
      return;
    }
    models.forEach((model, index) => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.appendChild(logoElement(model));
      const info = document.createElement("div");
      info.style.minWidth = "0";
      info.innerHTML = `<strong>${escapeHtml(model.name)}</strong><small>${escapeHtml(model.provider || "AI")}</small>`;
      item.appendChild(info);
      if(model.badge){
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = model.badge;
        item.appendChild(badge);
      }
      item.addEventListener("click", () => {
        activeModel = model;
        updateSelectedModel();
        modelMenu.classList.remove("open");
      });
      modelMenu.appendChild(item);
      if(index === 0) activeModel = activeModel || model;
    });
    updateSelectedModel();
  }

  function updateSelectedModel(){
    if(!activeModel) return;
    selectedModel.textContent = activeModel.name;
    selectedLogo.innerHTML = "";
    selectedLogo.appendChild(logoElement(activeModel));

    const welcomeOrb = $("welcomeOrb");
    if(welcomeOrb){
      if(welcomeOrbCleanup) welcomeOrbCleanup();
      welcomeOrbCleanup = load3DModelSpinner(welcomeOrb, activeModel.id);
    }
  }

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function addMessage(role, text, code = null, lang = "html"){
    welcome?.remove();
    const row = document.createElement("div");
    row.className = "message " + role;

    if(role === "ai"){
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      if(activeModel) avatar.appendChild(logoElement(activeModel, 20));
      row.appendChild(avatar);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = formatText(text);

    if(code){
      const card = document.createElement("div");
      card.className = "code-card";
      card.innerHTML = `
        <div class="code-head">
          <div class="dots"><i></i><i></i><i></i></div>
          <span class="lang">${escapeHtml(lang)}</span>
          <button class="copy" type="button">Copy</button>
        </div>
        <pre>${escapeHtml(code)}</pre>`;
      card.querySelector(".copy").addEventListener("click", async () => {
        await navigator.clipboard?.writeText(code);
        card.querySelector(".copy").textContent = "Copied";
        setTimeout(() => card.querySelector(".copy").textContent = "Copy", 1200);
      });
      bubble.appendChild(card);
    }

    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function formatText(text){
    return escapeHtml(text)
      .replace(/```[\s\S]*?```/g, "")
      .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="max-width:100%; border-radius:14px; margin-top:10px; display:block;" />')
      .replace(/\n/g, "<br>");
  }

  function showWorkspace(code, lang = "html"){
    latestCode = code;
    workspace.classList.add("active");
    closeWorkspace.style.display = "grid";
    editor.textContent = code;
    fileName.textContent = lang === "css" ? "styles.css" : lang === "js" || lang === "javascript" ? "script.js" : "index.html";
    const count = Math.max(1, code.split("\n").length);
    lineNos.textContent = Array.from({length: count}, (_,i) => i + 1).join("\n");
  }

  function extractCode(text){
    const match = text.match(/```(?:html|css|javascript|js|typescript|ts|json|jsx|tsx|xml)?\s*\n?([\s\S]*?)```/i);
    if(!match) return null;
    const raw = match[1].trim();
    const first = text.match(/```([a-z0-9+#-]*)/i);
    return { code: raw, lang: first?.[1] || "code" };
  }

  function loadingMessage(){
    const row = document.createElement("div");
    row.className = "message ai";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    if(activeModel) avatar.appendChild(logoElement(activeModel,20));
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const spinnerWrap = document.createElement("div");
    spinnerWrap.className = "spinner-3d-wrap";
    bubble.appendChild(spinnerWrap);

    const cleanup = load3DModelSpinner(spinnerWrap, activeModel?.id);
    row._cleanup3D = cleanup;

    row.append(avatar,bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  async function askModel(userText){
    if(!activeModel) throw new Error("No AI model is available in models.js.");

    const provider = String(activeModel.provider || "").toLowerCase();
    const isAnthropic = provider.includes("anthropic") || String(activeModel.endpoint).includes("anthropic.com");
    const isImageModel = activeModel.type === "image" || activeModel.isImage || String(activeModel.endpoint).includes("/images/generations");

    if(isImageModel){
      const body = {
        model: activeModel.id,
        prompt: userText,
        n: 1
      };
      const res = await fetch(activeModel.endpoint, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + activeModel.apiKey
        },
        body:JSON.stringify(body)
      });
      if(!res.ok) throw new Error(await res.text());
      const data = await res.json();
      const img = data?.data?.[0];
      const imgUrl = img?.url || (img?.b64_json ? `data:image/png;base64,${img.b64_json}` : null);
      if(imgUrl){
        return `![Generated Image](${imgUrl})`;
      }
      throw new Error("The image model did not return an image.");
    }

    if(isAnthropic){
      const body = {
        model: activeModel.id,
        max_tokens: 4096,
        messages: [{ role:"user", content:userText }]
      };
      const res = await fetch(activeModel.endpoint, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":activeModel.apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify(body)
      });
      if(!res.ok) throw new Error(await res.text());
      const data = await res.json();
      return data?.content?.map(x => x.text || "").join("") || "The model returned no text.";
    }

    const body = {
      model: activeModel.id,
      messages: [
        { role:"system", content:
          "You are an expert software engineer and web game developer. When the user asks for code, provide production-quality code in fenced code blocks. Prefer complete, runnable implementations and explain only what is useful."
        },
        { role:"user", content:userText }
      ],
      temperature:0.35
    };

    const res = await fetch(activeModel.endpoint, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + activeModel.apiKey
      },
      body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || data?.choices?.[0]?.text || "The model returned no text.";
  }

  async function submit(){
    const text = prompt.value.trim();
    if(!text || send.disabled) return;

    addMessage("user", text);
    prompt.value = "";
    send.disabled = true;
    const loading = loadingMessage();

    try{
      const answer = await askModel(text);
      if(loading._cleanup3D) loading._cleanup3D();
      loading.remove();

      const code = extractCode(answer);
      if(code){
        addMessage("ai", answer, code.code, code.lang);
        showWorkspace(code.code, code.lang);
      }else{
        addMessage("ai", answer);
      }
    }catch(error){
      if(loading._cleanup3D) loading._cleanup3D();
      loading.remove();
      addMessage("ai", "I couldn't reach the selected model. Check the endpoint, API key, CORS policy, and model ID in models.js.\n\n" + (error?.message || "Unknown error"));
    }finally{
      send.disabled = false;
      prompt.focus();
    }
  }

  modelSelect.addEventListener("click", e => {
    e.stopPropagation();
    modelMenu.classList.toggle("open");
  });
  document.addEventListener("click", () => modelMenu.classList.remove("open"));
  send.addEventListener("click", submit);
  prompt.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      submit();
    }
  });
  $("clearPrompt").addEventListener("click", () => { prompt.value = ""; prompt.focus(); });
  closeWorkspace.addEventListener("click", () => {
    workspace.classList.remove("active");
    closeWorkspace.style.display = "none";
  });
  $("copyCode").addEventListener("click", async () => {
    if(!latestCode) return;
    await navigator.clipboard?.writeText(latestCode);
  });
  $("newChat").addEventListener("click", () => {
    messages.innerHTML = "";
    messages.appendChild(welcomeTemplate());
    latestCode = "";
    workspace.classList.remove("active");
    closeWorkspace.style.display = "none";
    updateSelectedModel();
  });

  function welcomeTemplate(){
    const el = document.createElement("div");
    el.className = "welcome";
    el.innerHTML = `
      <div class="orb">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z" stroke="#dbe0ff" stroke-width="1.4"/><path d="m19 4 .55 1.45L21 6l-1.45.55L19 8l-.55-1.45L17 6l1.45-.55L19 4Z" stroke="#8190ff" stroke-width="1.1"/></svg>
      </div>
      <h1>What are we building?</h1>
      <p>Describe the website, game, app, or feature you want to create.</p>`;
    return el;
  }

  renderModels();
  prompt.focus();
  </script>
</body>
